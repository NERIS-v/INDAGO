name: Mirror images to GHCR

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/mirror-images-to-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - src: pgvector/pgvector:pg16
            dst: ghcr.io/neris-v/pgvector-pg16:pg16
            digest: sha256:a97d77306ff47cc1d8add4d000cec2207da2e110746318df3137ce53c337ca30
          - src: redis:7-alpine
            dst: ghcr.io/neris-v/redis:7-alpine
            digest: sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, verify digest (amd64), tag, push to GHCR (public)
        run: |
          docker pull --platform linux/amd64 "${{ matrix.src }}"@${{ matrix.digest }}
          docker tag "${{ matrix.src }}"@${{ matrix.digest }} "${{ matrix.dst }}"
          docker push "${{ matrix.dst }}"
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled

      # Note: GHCR packages become public via repo settings/packages; this workflow
      # pushes to the current repository's GHCR namespace (neris-v). The packages
      # must be made public to allow unauthenticated pulls in CI.
