name: INDAGO V7 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Ensures the database client is generated before TypeScript checks it
        run: cd packages/platform && pnpm exec prisma generate

      - name: Run Tests (Vitest)
        # Runs all tests across the monorepo to ensure the recovery/grounding logic passes
        run: pnpm --recursive test