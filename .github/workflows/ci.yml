name: INDAGO V7 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # Ensures the database client is generated before typechecking
        run: cd packages/platform && pnpm exec prisma generate

      - name: Build
        # Compiles the code across all workspaces
        run: pnpm --recursive run build

      - name: Typecheck
        # Runs strict TypeScript validation
        run: pnpm --recursive run typecheck

      - name: Run Tests (Vitest)
        # Runs the test suites only if the build and types are perfectly valid
        run: pnpm --recursive test